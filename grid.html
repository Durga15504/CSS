<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .img1{grid-area: rose;}
        .img2{grid-area: horse;}
        .img3{grid-area: moon;}
        .img4{grid-area: lion;}
        .img5{grid-area: paris;}
        .img6{grid-area: flower;}
        .img7{grid-area: colour;}
        .img8{grid-area: duck;}
        .img9{grid-area: night;}
        .img10{grid-area: eye;}
        .img11{grid-area: farmer;}
        .img12{grid-area: track;}
        .img13{grid-area: shine;}
       .main{
        display: grid;
        grid-template-areas: 
        'rose horse moon lion paris'
        'flower horse moon lion paris'
        'flower colour duck night eye'
        'farmer colour track night shine';
        width: 100%;
        height: 100vh;
        gap: 5px;
       }
       .main > div {
            width: 100%;
            height: 100%;
       }
       .main img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }
    </style>
</head>
<body>
    <div class="main">
